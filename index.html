<!DOCTYPE html>
<html lang="th" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorea's Princess Journey - Reader</title>
  
  <!-- Google Fonts for typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Sarabun:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  
  <!-- Application CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Third-Party Markdown & Diagram Parsers -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Firebase Compat SDKs (For Real-time Comments) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Embedded Data Bundle (Offline & file:// Support) -->
  <script src="data/embedded_data.js"></script>
</head>

<body>

  <!-- Scroll Progress Bar -->
  <div id="progress-bar"></div>

  <!-- Header -->
  <header>
    <div class="header-left">
      <button class="btn" id="menu-btn" title="สารบัญ (Menu)">
        <svg viewBox="0 0 24 24">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="chapter-title-header" id="header-title">กำลังโหลด...</div>
    </div>

    <div class="header-right">
      <!-- Font Family Switcher -->
      <button class="btn" id="font-btn" title="เปลี่ยนฟอนต์ Serif / Sans">
        <svg viewBox="0 0 24 24">
          <path d="M4 7V4h16v3M9 20h6M12 4v16" />
        </svg>
      </button>

      <!-- Font Size Controls -->
      <button class="btn" id="size-dec-btn" title="ลดขนาดตัวอักษร">
        <svg viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button class="btn" id="size-inc-btn" title="เพิ่มขนาดตัวอักษร">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <!-- Paragraph Indentation Toggle -->
      <button class="btn" id="indent-btn" title="ย่อหน้าบรรทัดแรก (Toggle Indentation)">
        <svg viewBox="0 0 24 24">
          <line x1="10" y1="6" x2="21" y2="6"></line>
          <line x1="10" y1="12" x2="21" y2="12"></line>
          <line x1="4" y1="18" x2="21" y2="18"></line>
          <polyline points="4 6 7 9 4 12"></polyline>
        </svg>
      </button>

      <!-- Alignment Toggle -->
      <button class="btn" id="align-btn" title="สลับการจัดตำแหน่ง Left / Justified">
        <svg viewBox="0 0 24 24">
          <line x1="21" y1="10" x2="3" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="21" y1="18" x2="3" y2="18"></line>
        </svg>
      </button>

      <!-- Comments Sidebar Toggle -->
      <button class="btn" id="comment-sidebar-btn" title="ความคิดเห็น (Comments)" style="position: relative;">
        <svg viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span id="comment-count-badge" style="position: absolute; top: 2px; right: 2px; background-color: #ef4444; color: white; font-size: 0.6rem; font-weight: bold; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; display: none;">0</span>
      </button>

      <!-- Theme Switcher -->
      <button class="btn" id="theme-btn" title="เปลี่ยนธีม">
        <svg class="theme-icon-light" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon-dark" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Sidebar Menu -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">ตอนทั้งหมด</span>
      <button class="btn" id="close-sidebar-btn" title="ปิด">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="sidebar-content">
      <ul class="chapter-list" id="chapter-list-ul">
        <!-- Chapters loaded dynamically -->
      </ul>
    </div>
  </nav>

  <!-- Overlay -->
  <div id="overlay"></div>

  <!-- Main Reader Container -->
  <main class="reader-container">
    <article class="reader-content" id="reader-content">
      <!-- Loading Skeleton Template -->
      <div id="skeleton-loader">
        <div class="skeleton title"></div>
        <div class="skeleton p"></div>
        <div class="skeleton p"></div>
        <div class="skeleton p"></div>
        <div class="skeleton p-last"></div>
        <br>
        <div class="skeleton p"></div>
        <div class="skeleton p"></div>
        <div class="skeleton p-last"></div>
      </div>
    </article>

    <!-- Bottom Prev/Next Footer -->
    <nav class="nav-footer">
      <a href="#" class="nav-link disabled" id="prev-chapter-btn">
        <svg viewBox="0 0 24 24">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>ตอนก่อนหน้า</span>
      </a>
      <a href="#" class="nav-link disabled" id="next-chapter-btn">
        <span>ตอนถัดไป</span>
        <svg viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </nav>
  </main>

  <!-- Text Selection Floating Action Menu -->
  <div id="selection-menu">
    <button class="selection-menu-btn btn-praise" id="sel-btn-praise" title="ชื่นชม">
      <svg viewBox="0 0 24 24">
        <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
      </svg>
    </button>
    <button class="selection-menu-btn btn-suggest" id="sel-btn-suggest" title="เสนอแนะให้แก้ไข">
      <svg viewBox="0 0 24 24">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
    </button>
    <button class="selection-menu-btn btn-replace" id="sel-btn-replace" title="แทนที่คำ">
      <svg viewBox="0 0 24 24">
        <polyline points="17 1 21 5 17 9"></polyline>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <polyline points="7 23 3 19 7 15"></polyline>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
    </button>
  </div>

  <!-- Floating Comment Tooltip -->
  <div id="comment-tooltip"></div>

  <!-- Right Comments Sidebar -->
  <aside id="comment-sidebar">
    <div class="comment-sidebar-header">
      <span class="comment-sidebar-title">ความคิดเห็น</span>
      <div class="comment-sidebar-actions">
        <button class="btn" id="comment-export-btn" title="ส่งออกคอมเมนต์ (JSON)">
          <svg viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button class="btn" id="comment-delete-all-btn" title="ลบคอมเมนต์ทั้งหมด">
          <svg viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
        <button class="btn" id="close-comment-sidebar-btn" title="ปิด">
          <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="comment-sidebar-tabs">
      <button class="comment-tab-btn active" data-filter="chapter">บทนี้ (<span id="tab-count-chapter">0</span>)</button>
      <button class="comment-tab-btn" data-filter="all">ทั้งหมด (<span id="tab-count-all">0</span>)</button>
      <button class="comment-tab-btn" data-filter="praise">ชื่นชม</button>
      <button class="comment-tab-btn" data-filter="suggest">เสนอแนะ</button>
      <button class="comment-tab-btn" data-filter="replace">แทนที่</button>
    </div>

    <!-- Date Filter Bar -->
    <div class="comment-date-filter-bar">
      <div class="date-filter-row">
        <select class="comment-date-select" id="comment-date-preset">
          <option value="today" selected>แสดงเฉพาะวันนี้</option>
          <option value="7days">7 วันล่าสุด</option>
          <option value="all">แสดงวันทั้งหมด</option>
          <option value="custom">กำหนดช่วงวันที่...</option>
        </select>
        <span class="filtered-count-tag" id="filtered-comments-tag">0 รายการ</span>
      </div>
      <div class="custom-date-group" id="comment-custom-date-group" style="display: none;">
        <input type="date" class="comment-date-input" id="comment-date-start">
        <span>ถึง</span>
        <input type="date" class="comment-date-input" id="comment-date-end">
      </div>
    </div>

    <!-- Comments List Container -->
    <div class="comment-sidebar-content" id="comment-sidebar-list">
      <!-- Comment Cards injected dynamically -->
    </div>
  </aside>

  <!-- Image Lightbox Modal -->
  <div id="image-modal">
    <div class="image-modal-controls">
      <button class="image-modal-btn" id="image-zoom-btn" title="ขยาย/ย่อรูป">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
      <button class="image-modal-btn" id="close-image-modal-btn" title="ปิด">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="image-modal-container">
      <img id="image-modal-img" class="image-modal-img" src="" alt="Full Preview">
      <div id="image-modal-caption" class="image-modal-caption"></div>
    </div>
  </div>

  <!-- Comment Creation Form Modal -->
  <div id="comment-modal">
    <div class="modal-content">
      <h3 class="modal-title" id="comment-modal-title">เสนอแนะความคิดเห็น</h3>
      <div class="modal-quote" id="comment-modal-quote"></div>
      
      <div id="comment-modal-replace-container" style="display: none;">
        <label style="font-family: var(--font-sans); font-size: 0.82rem; font-weight: 500; color: var(--text-muted); display: block; margin-bottom: 4px;">คำ/ประโยคใหม่ที่จะใช้แทนที่:</label>
        <input type="text" id="comment-modal-replace-input" style="width: 100%; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--sidebar-bg); color: var(--text-color); font-family: var(--font-sans); font-size: 0.9rem; padding: 8px 10px; outline: none;" placeholder="กรอกคำที่ต้องการแทนที่...">
      </div>

      <div>
        <label style="font-family: var(--font-sans); font-size: 0.82rem; font-weight: 500; color: var(--text-muted); display: block; margin-bottom: 4px;">ข้อความความคิดเห็น / เหตุผล:</label>
        <textarea class="modal-textarea" id="comment-modal-textarea" placeholder="กรอกความคิดเห็นของคุณ..."></textarea>
      </div>

      <div class="modal-footer">
        <button class="modal-btn cancel" id="comment-modal-cancel">ยกเลิก</button>
        <button class="modal-btn save" id="comment-modal-save">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- Audio Player Bar (Floating Bottom) -->
  <div id="audio-player-container" class="audio-player-container" style="display: none;">
    <audio id="chapter-audio" preload="metadata"></audio>
    <div class="audio-controls">
      <button class="audio-btn" id="audio-play-btn" title="เล่น/หยุดเสียง">
        <svg id="icon-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><rect x="6" y="4" width="4" height="16" fill="currentColor"></rect><rect x="14" y="4" width="4" height="16" fill="currentColor"></rect></svg>
      </button>
      <div class="audio-progress-wrapper" id="audio-progress-wrapper">
        <div class="audio-progress-bg"></div>
        <div class="audio-progress-fill" id="audio-progress-fill"></div>
      </div>
      <span class="audio-time-display" id="audio-time-display">0:00 / 0:00</span>
      <button class="audio-btn close-audio" id="audio-close-btn" title="ปิดเครื่องเล่น">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <!-- Application Modular JavaScript Files -->
  <script src="js/loading.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/diagram.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
