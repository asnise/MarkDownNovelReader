<!DOCTYPE html>
<html lang="th" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorea's Princess Journey - Reader</title>
  <!-- Google Fonts for beautiful minimalist typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Sarabun:ital,wght@0,300;0,400;0,500;1,300&display=swap"
    rel="stylesheet">
  <!-- Markdown & Diagram Parsers -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <style>
    :root {
      --font-sans: 'Inter', 'Sarabun', system-ui, -apple-system, sans-serif;
      --font-serif: 'Lora', 'Sarabun', 'Georgia', serif;

      /* Light theme values */
      --bg-color: #faf9f6;
      --text-color: #1a1917;
      --border-color: #e6e4df;
      --sidebar-bg: #f3f1eb;
      --sidebar-hover: #e7e5df;
      --header-bg: rgba(250, 249, 246, 0.85);
      --accent-color: #1a1917;
      --accent-rgb: 26, 25, 23;
      --text-muted: #706e6a;

      --font-size-base: 18px;
    }

    [data-theme="dark"] {
      /* Dark theme values (Minimalist black/charcoal) */
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --border-color: #242424;
      --sidebar-bg: #181818;
      --sidebar-hover: #262626;
      --header-bg: rgba(18, 18, 18, 0.85);
      --accent-color: #ffffff;
      --accent-rgb: 255, 255, 255;
      --text-muted: #8e8e8e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-serif);
      font-size: var(--font-size-base);
      line-height: 1.8;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body.use-sans {
      font-family: var(--font-sans);
      line-height: 1.7;
    }

    /* Scroll Progress Bar */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 2px;
      background-color: var(--accent-color);
      z-index: 1020;
      transition: width 0.1s ease;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background-color: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 1000;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .header-right::-webkit-scrollbar {
      display: none;
    }

    /* Minimalist Buttons */
    .btn {
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      outline: none;
      opacity: 0.8;
      flex-shrink: 0;
    }

    .btn:hover {
      background-color: var(--sidebar-hover);
      opacity: 1;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chapter-title-header {
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 0.85rem;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.7;
    }

    /* Sidebar Menu */
    #sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: -280px;
      width: 280px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      z-index: 1010;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    #sidebar.open {
      transform: translateX(280px);
    }

    .sidebar-header {
      height: 56px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    .sidebar-title {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .sidebar-content {
      overflow-y: auto;
      flex-grow: 1;
      padding: 12px 0;
    }

    .chapter-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .chapter-item {
      padding: 10px 16px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      transition: background-color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
      border-left: 2px solid transparent;
      opacity: 0.85;
      line-height: 1.4;
    }

    .chapter-item:hover {
      background-color: var(--sidebar-hover);
      opacity: 1;
    }

    .chapter-item.active {
      border-left-color: var(--accent-color);
      font-weight: 500;
      background-color: var(--sidebar-hover);
      opacity: 1;
    }

    /* Overlay */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.25);
      z-index: 1005;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    [data-theme="dark"] #overlay {
      background-color: rgba(0, 0, 0, 0.5);
    }

    #overlay.open {
      opacity: 1;
      visibility: visible;
    }

    /* Main Content Container */
    .reader-container {
      max-width: 660px;
      margin: 92px auto 60px auto;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .reader-content {
      margin-bottom: 50px;
    }

    /* Markdown elements styling */
    .reader-content p {
      margin-top: 0;
      margin-bottom: 1.5em;
      text-align: justify;
      text-justify: inter-character;
      word-break: normal;
      overflow-wrap: break-word;
    }

    body.align-left .reader-content p {
      text-align: left;
      text-justify: auto;
    }

    body.indent-enabled .reader-content p {
      text-indent: 2.5em;
    }

    .reader-content h1,
    .reader-content h2,
    .reader-content h3 {
      font-family: var(--font-sans);
      font-weight: 600;
      line-height: 1.3;
      margin-top: 1.8em;
      margin-bottom: 0.8em;
      color: var(--text-color);
    }

    .reader-content h1 {
      font-size: 1.6rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-top: 0;
      margin-bottom: 1.5em;
    }

    .reader-content h2 {
      font-size: 1.3rem;
    }

    .reader-content h3 {
      font-size: 1.15rem;
    }

    .reader-content hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 2.5em 0;
    }

    .reader-content blockquote {
      margin: 1.5em 0;
      padding-left: 16px;
      border-left: 2px solid var(--border-color);
      color: var(--text-muted);
      font-style: italic;
    }

    /* Bottom Navigation */
    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding: 24px 0 48px 0;
      gap: 16px;
      margin-top: 40px;
    }

    .nav-link {
      font-family: var(--font-sans);
      text-decoration: none;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .nav-link:hover {
      background-color: var(--sidebar-hover);
    }

    .nav-link.disabled {
      opacity: 0.25;
      cursor: not-allowed;
      pointer-events: none;
    }

    .nav-link svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* CORS / File Protocol Alert */
    .fallback-card {
      padding: 24px;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      font-family: var(--font-sans);
      text-align: center;
      background-color: var(--sidebar-bg);
    }

    .fallback-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .fallback-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .code-instruction {
      background-color: var(--bg-color);
      padding: 8px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      border: 1px solid var(--border-color);
      display: inline-block;
      margin-bottom: 8px;
    }

    /* Utility labels */
    .theme-icon-light,
    .theme-icon-dark {
      display: none;
    }

    [data-theme="light"] .theme-icon-dark {
      display: block;
    }

    [data-theme="dark"] .theme-icon-light {
      display: block;
    }

    /* Skeleton Loading */
    .skeleton {
      animation: skeleton-loading 1.2s infinite ease-in-out;
      background-color: var(--sidebar-bg);
      border-radius: 4px;
      height: 1.2em;
      margin-bottom: 1em;
    }

    .skeleton.title {
      height: 2em;
      width: 60%;
      margin-bottom: 2em;
    }

    .skeleton.p {
      width: 100%;
    }

    .skeleton.p-last {
      width: 80%;
    }

    @keyframes skeleton-loading {
      0% {
        opacity: 0.6;
      }

      50% {
        opacity: 0.3;
      }

      100% {
        opacity: 0.6;
      }
    }

    /* Comment Selection Menu */
    #selection-menu {
      position: absolute;
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 4px 8px;
      display: flex;
      gap: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      z-index: 1002;
      opacity: 0;
      visibility: hidden;
      transform: translateY(5px) scale(0.95);
      transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #selection-menu.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .selection-menu-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      transition: background-color 0.2s;
    }

    .selection-menu-btn:hover {
      background-color: var(--sidebar-hover);
    }

    .selection-menu-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .selection-menu-btn.btn-praise {
      color: #10b981;
    }

    .selection-menu-btn.btn-suggest {
      color: #f59e0b;
    }

    /* Comment Highlights */
    .comment-highlight {
      cursor: pointer;
      position: relative;
      transition: background-color 0.2s;
    }

    .comment-highlight.status-praise {
      background-color: rgba(16, 185, 129, 0.15);
      border-bottom: 2px dotted #10b981;
    }

    .comment-highlight.status-suggest {
      background-color: rgba(245, 158, 11, 0.15);
      border-bottom: 2px dotted #f59e0b;
    }

    .comment-highlight:hover {
      background-color: rgba(16, 185, 129, 0.25);
    }

    .comment-highlight.status-suggest:hover {
      background-color: rgba(245, 158, 11, 0.25);
    }

    /* Floating Comment Tooltip */
    #comment-tooltip {
      position: absolute;
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      z-index: 1003;
      max-width: 280px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      font-size: 0.85rem;
      line-height: 1.5;
      font-family: var(--font-sans);
    }

    #comment-tooltip.active {
      opacity: 1;
      visibility: visible;
    }

    .tooltip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 0.75rem;
    }

    .tooltip-header.praise {
      color: #10b981;
    }

    .tooltip-header.suggest {
      color: #f59e0b;
    }

    .tooltip-time {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Image Lightbox Modal */
    #image-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #image-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .image-modal-container {
      position: relative;
      max-width: 92vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .image-modal-img {
      max-width: 92vw;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: zoom-in;
    }

    .image-modal-img.zoomed {
      transform: scale(1.6);
      cursor: zoom-out;
    }

    .image-modal-caption {
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      margin-top: 14px;
      text-align: center;
      opacity: 0.9;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
    }

    .image-modal-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 2010;
    }

    .image-modal-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .image-modal-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.05);
    }

    .image-modal-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    /* Enhanced Markdown Figures & Images */
    .reader-image-figure {
      margin: 24px 0;
      text-align: center;
    }

    .reader-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 12px auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: block;
    }

    .reader-content img:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .reader-image-caption {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      font-style: italic;
    }

    /* Internal Markdown Document Links & Image Badges */
    .reader-content a.internal-doc-link {
      color: var(--accent-color);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
      transition: opacity 0.2s ease, text-decoration-color 0.2s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .reader-content a.internal-doc-link:hover {
      opacity: 0.75;
      text-decoration-color: transparent;
    }

    .reader-content a.image-link-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 16px;
      color: var(--text-color);
      text-decoration: none;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      margin: 4px 0;
      transition: background-color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .reader-content a.image-link-badge:hover {
      background-color: var(--sidebar-hover);
      transform: translateY(-1px);
    }

    /* Mermaid Diagrams Container & Styling */
    .mermaid-container {
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin: 24px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .mermaid {
      font-family: var(--font-sans) !important;
      max-width: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* Built-in Standalone Relationship Graph Renderer */
    .builtin-graph-wrapper {
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      font-family: var(--font-sans);
      width: 100%;
    }

    .graph-groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .graph-group-card {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .graph-group-card:hover {
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }

    .graph-group-header {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      margin-bottom: 4px;
      opacity: 0.9;
    }

    .graph-group-nodes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .graph-node-pill {
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, transform 0.2s, border-color 0.2s;
      cursor: default;
    }

    .graph-node-pill:hover {
      background-color: var(--sidebar-hover);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .node-title {
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--text-color);
    }

    .node-subtext {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Relationship Connections List */
    .graph-connections-container {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .graph-connections-title {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .graph-connections-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 8px;
    }

    .graph-edge-card {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .graph-edge-card:hover {
      border-color: var(--accent-color);
      background-color: var(--sidebar-bg);
    }

    .graph-edge-card.thick {
      border-left: 3.5px solid var(--accent-color);
    }

    .graph-edge-card.dashed {
      border-style: dashed;
    }

    .edge-from,
    .edge-to {
      font-weight: 600;
      color: var(--text-color);
    }

    .edge-arrow {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .edge-label-badge {
      margin-left: auto;
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Tree Graph Layout Styling */
    .tree-graph-wrapper {
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      font-family: var(--font-sans);
      width: 100%;
    }

    .tree-graph-header {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tree-subgraph-group {
      margin-bottom: 22px;
    }

    .tree-subgraph-group:last-child {
      margin-bottom: 0;
    }

    .tree-subgraph-title {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-color);
      margin-bottom: 10px;
      padding: 4px 10px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: inline-block;
      opacity: 0.95;
    }

    .tree-cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tree-character-card {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .tree-character-card:hover {
      border-color: var(--accent-color);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .tree-char-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tree-char-title {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text-color);
    }

    .tree-char-subtext {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .tree-branches {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 10px;
      border-left: 2px dashed var(--border-color);
      margin-left: 6px;
    }

    .tree-branch {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      line-height: 1.4;
    }

    .tree-branch-symbol {
      font-family: monospace;
      color: var(--text-muted);
      font-weight: bold;
    }

    .tree-branch-target {
      font-weight: 600;
      color: var(--text-color);
    }

    .tree-branch-arrow {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .tree-branch-badge {
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      padding: 2px 9px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tree-branch-badge.thick {
      font-weight: 600;
      color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .tree-branch-badge.dashed {
      border-style: dashed;
    }

    /* Modern Responsive Markdown Table Theme */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin: 24px 0;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      background-color: var(--sidebar-bg);
      -webkit-overflow-scrolling: touch;
    }

    .reader-content table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      text-align: left;
      margin: 0;
    }

    .reader-content th {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      white-space: nowrap;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    .reader-content td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-color);
      line-height: 1.6;
      vertical-align: middle;
    }

    .reader-content tr:last-child td {
      border-bottom: none;
    }

    .reader-content tr:nth-child(even) {
      background-color: rgba(0, 0, 0, 0.02);
    }
    [data-theme="dark"] .reader-content tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.025);
    }

    .reader-content tr:hover td {
      background-color: var(--sidebar-hover);
    }

    /* Threat Code / Tag Badges */
    .threat-tag-badge {
      display: inline-block;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.74rem;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }

    .threat-tag-badge.threat-pax {
      background-color: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.3);
    }
    .threat-tag-badge.threat-hor {
      background-color: rgba(59, 130, 246, 0.12);
      color: #3b82f6;
      border-color: rgba(59, 130, 246, 0.3);
    }
    .threat-tag-badge.threat-per {
      background-color: rgba(245, 158, 11, 0.12);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.3);
    }
    .threat-tag-badge.threat-mor {
      background-color: rgba(168, 85, 247, 0.12);
      color: #a855f7;
      border-color: rgba(168, 85, 247, 0.3);
    }
    .threat-tag-badge.threat-rui {
      background-color: rgba(107, 114, 128, 0.12);
      color: #6b7280;
      border-color: rgba(107, 114, 128, 0.3);
    }
    .threat-tag-badge.threat-cat {
      background-color: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .threat-tag-badge.threat-aby {
      background-color: rgba(225, 29, 72, 0.2);
      color: #e11d48;
      border-color: rgba(225, 29, 72, 0.5);
      box-shadow: 0 0 8px rgba(225, 29, 72, 0.2);
    }

    /* Right-Side Comment Sidebar */
    #comment-sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      right: -300px;
      width: 300px;
      background-color: var(--sidebar-bg);
      border-left: 1px solid var(--border-color);
      z-index: 1010;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    #comment-sidebar.open {
      transform: translateX(-300px);
    }

    .comment-sidebar-header {
      height: 56px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    .comment-sidebar-title {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .comment-sidebar-actions {
      display: flex;
      gap: 4px;
    }

    /* Comment Tabs & Global View Badges */
    .comment-sidebar-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--sidebar-bg);
      overflow-x: auto;
      scroll-behavior: smooth;
    }

    .comment-tab-btn {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 3px 10px;
      font-size: 0.74rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: var(--font-sans);
    }

    .comment-tab-btn:hover {
      border-color: var(--accent-color);
      color: var(--text-color);
    }

    .comment-tab-btn.active {
      background-color: var(--text-color);
      color: var(--bg-color);
      border-color: var(--text-color);
    }

    .comment-tab-btn.active span {
      color: var(--bg-color);
    }

    .comment-card-chapter-badge {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent-color);
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .comment-card-chapter-badge:hover {
      border-color: var(--accent-color);
      background-color: var(--sidebar-hover);
    }

    /* Date Filter Styling */
    .comment-date-filter-bar {
      padding: 8px 12px;
      background-color: var(--sidebar-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .date-filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .comment-date-select {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.76rem;
      font-family: var(--font-sans);
      outline: none;
      cursor: pointer;
      flex-grow: 1;
    }

    .comment-date-select:focus {
      border-color: var(--accent-color);
    }

    .filtered-count-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .custom-date-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      margin-top: 2px;
    }

    .comment-date-input {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 0.72rem;
      font-family: var(--font-sans);
      width: 100%;
      outline: none;
    }

    .comment-date-input:focus {
      border-color: var(--accent-color);
    }

    .comment-sidebar-content {
      overflow-y: auto;
      flex-grow: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Jump & Highlight Pulse Animation */
    @keyframes jumpHighlightPulse {
      0% {
        background-color: #ef4444 !important;
        color: #ffffff !important;
        box-shadow: 0 0 16px rgba(239, 68, 68, 0.9), 0 0 30px rgba(239, 68, 68, 0.5);
        border-radius: 4px;
      }
      50% {
        background-color: rgba(239, 68, 68, 0.65) !important;
        box-shadow: 0 0 24px rgba(239, 68, 68, 0.8);
      }
      100% {
        box-shadow: none;
      }
    }

    .comment-highlight.jump-active {
      animation: jumpHighlightPulse 2s ease-in-out forwards;
      transition: all 0.3s ease;
    }

    .comment-card {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .comment-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      border-color: var(--accent-color);
    }

    .comment-card-quote {
      font-size: 0.8rem;
      color: var(--text-muted);
      border-left: 2px solid var(--border-color);
      padding-left: 8px;
      margin: 0;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .comment-card-quote:hover {
      color: var(--text-color);
    }

    .comment-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .comment-card-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .comment-card-badge.praise {
      background-color: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }

    .comment-card-badge.suggest {
      background-color: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
    }

    .comment-card-text {
      line-height: 1.5;
      word-break: break-word;
      color: var(--text-color);
    }

    .comment-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .comment-card-time {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .comment-card-btns {
      display: flex;
      gap: 6px;
    }

    .comment-card-btn {
      background: none;
      border: none;
      padding: 2px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .comment-card-btn:hover {
      color: var(--text-color);
    }

    .comment-card-btn.delete:hover {
      color: #ef4444;
    }

    .comment-card-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .empty-comments {
      text-align: center;
      color: var(--text-muted);
      margin-top: 40px;
      font-size: 0.85rem;
    }

    /* Comment Modal Form */
    #comment-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1020;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    #comment-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transform: translateY(20px);
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #comment-modal.open .modal-content {
      transform: translateY(0);
    }

    .modal-title {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 1.1rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-title.praise {
      color: #10b981;
    }

    .modal-title.suggest {
      color: #f59e0b;
    }

    .modal-quote {
      font-size: 0.85rem;
      color: var(--text-muted);
      border-left: 2px solid var(--border-color);
      padding-left: 10px;
      margin: 0;
      font-style: italic;
      max-height: 80px;
      overflow-y: auto;
    }

    .modal-textarea {
      width: 100%;
      height: 100px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--sidebar-bg);
      color: var(--text-color);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      padding: 10px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-textarea:focus {
      border-color: var(--accent-color);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .modal-btn.cancel {
      background-color: var(--sidebar-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .modal-btn.cancel:hover {
      background-color: var(--sidebar-hover);
    }

    .modal-btn.save {
      background-color: var(--accent-color);
      color: var(--bg-color);
    }

    .modal-btn.save:hover {
      opacity: 0.9;
    }

    @media (max-width: 480px) {
      .chapter-title-header {
        display: none;
      }

      .header-left {
        gap: 6px;
      }

      header {
        padding: 0 8px;
      }
    }
  </style>
</head>

<body>

  <!-- Scroll Progress Bar -->
  <div id="progress-bar"></div>

  <!-- Header -->
  <header>
    <div class="header-left">
      <button class="btn" id="menu-btn" title="สารบัญ (Menu)">
        <svg viewBox="0 0 24 24">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="chapter-title-header" id="header-title">กำลังโหลด...</div>
    </div>

    <div class="header-right">
      <!-- Font Family Switcher -->
      <button class="btn" id="font-btn" title="เปลี่ยนฟอนต์ Serif / Sans">
        <svg viewBox="0 0 24 24">
          <path d="M4 7V4h16v3M9 20h6M12 4v16" />
        </svg>
      </button>

      <!-- Font Size Outlines -->
      <button class="btn" id="size-dec-btn" title="ลดขนาดตัวอักษร">
        <svg viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button class="btn" id="size-inc-btn" title="เพิ่มขนาดตัวอักษร">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <!-- Paragraph Indentation Toggle -->
      <button class="btn" id="indent-btn" title="ย่อหน้าบรรทัดแรก (Toggle Indentation)">
        <svg viewBox="0 0 24 24">
          <line x1="10" y1="6" x2="21" y2="6"></line>
          <line x1="10" y1="12" x2="21" y2="12"></line>
          <line x1="4" y1="18" x2="21" y2="18"></line>
          <polyline points="4 6 7 9 4 12"></polyline>
        </svg>
      </button>

      <!-- Alignment Toggle -->
      <button class="btn" id="align-btn" title="สลับการจัดตำแหน่ง Left / Justified">
        <svg viewBox="0 0 24 24">
          <line x1="21" y1="10" x2="3" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="21" y1="18" x2="3" y2="18"></line>
        </svg>
      </button>

      <!-- Comments Sidebar Toggle -->
      <button class="btn" id="comment-sidebar-btn" title="ความคิดเห็น (Comments)" style="position: relative;">
        <svg viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span id="comment-count-badge"
          style="position: absolute; top: 2px; right: 2px; background-color: #ef4444; color: white; font-size: 0.6rem; font-weight: bold; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; display: none;">0</span>
      </button>

      <!-- Theme Switcher -->
      <button class="btn" id="theme-btn" title="เปลี่ยนธีม">
        <!-- Sun icon (shown in dark theme) -->
        <svg class="theme-icon-light" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon icon (shown in light theme) -->
        <svg class="theme-icon-dark" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Sidebar menu -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">ตอนทั้งหมด</span>
      <button class="btn" id="close-sidebar-btn" title="ปิด">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="sidebar-content">
      <ul class="chapter-list" id="chapter-list-ul">
        <!-- Chapters loaded dynamically -->
      </ul>
    </div>
  </nav>

  <!-- Sidebar Overlay Overlay -->
  <div id="overlay"></div>

  <!-- Main Reader Container -->
  <main class="reader-container">
    <article class="reader-content" id="reader-content">
      <!-- Loading Skeleton initially -->
      <div id="skeleton-loader">
        <div class="skeleton title"></div>

  <script>
    // Path and Link Resolver Helpers
    function resolveImagePath(url) {
      if (!url) return '';
      let clean = decodeURIComponent(url).replace(/^file:\/\/\//i, '').replace(/\\/g, '/');

      if (clean.includes('Story Section/')) {
        clean = clean.split('Story Section/')[1];
      } else if (clean.includes('Story%20Section/')) {
        clean = clean.split('Story%20Section/')[1];
      }

      clean = clean.replace(/^\/+/, '').replace(/^data\//, '');
      return `data/${clean}`;
    }

    function findChapterIndexByUrl(url) {
      if (!url) return -1;
      let clean = decodeURIComponent(url).replace(/^file:\/\/\//i, '').replace(/\\/g, '/');
      let filename = clean.split('/').pop().split('#')[0].trim();

      if (!filename) return -1;

      // 1. Match exact filename or relative path
      for (let i = 0; i < STATE.chapters.length; i++) {
        const chFile = STATE.chapters[i].file;
        const chBase = chFile.split('/').pop();
        if (chFile === filename || chBase === filename || chFile.endsWith('/' + filename) || filename.endsWith('/' + chBase)) {
          return i;
        }
      }

      // 2. Fallback: match without .md extension or case-insensitive match
      const filenameNoExt = filename.replace(/\.md$/i, '').toLowerCase();
      for (let i = 0; i < STATE.chapters.length; i++) {
        const chFileNoExt = STATE.chapters[i].file.split('/').pop().replace(/\.md$/i, '').toLowerCase();
        if (chFileNoExt === filenameNoExt) {
          return i;
        }
      }

      return -1;
    }

    // Configurable state

    };

    // Hardcoded fallback list of chapters if chapters.json fails to load (e.g. running on file:// protocol)

      { "file": "Creature/Dragon_Lily.md", "title": "[Creature] แพกเซียน: ดอกลิลลี่มังกร (Dragon Lily)" },
      { "file": "Creature/Gloom_Centipede.md", "title": "[Creature] ฮอร์เดียน: ตะขาบเงามืดสะท้อนแสง (Gloom Centipede)" },
      { "file": "Characters/Relationship_Map.md", "title": "[Character] แผนผังความสัมพันธ์ตัวละคร (Character Relationship Map)" },
      { "file": "Chapter_00_The_Cradle_of_Dorea.md", "title": "ตอนที่ 0: ของขวัญจากฟากฟ้า และคำสัญญาอันแสนอบอุ่น (The Cradle of Dorea)" },
      { "file": "Chapter_01_The_Ash_of_Draconia.md", "title": "ตอนที่ 1: วันที่ท้องฟ้าถล่ม และอ้อมกอดสุดท้าย (The Ash of Draconia)" },
      { "file": "Chapter_02_The_Origin_of_Tar.md", "title": "ตอนที่ 2: รอยแผลแห่งเอเธลการ์ด และคุณหมอผู้อ่อนโยน (The Origin of Thar)" },
      { "file": "Chapter_03_The_Cold_Embrace.md", "title": "ตอนที่ 3: แขนสีเงินกลางป่าลึก และอ้อมกอดของคนแปลกหน้า (The Cold Embrace)" },
      { "file": "Chapter_04_The_Doctors_Suture.md", "title": "ตอนที่ 4: คืนพายุโหม และเส้นทางสู่บ้าน (The Doctor's Suture - Journey)" },
      { "file": "Chapter_05_The_Tense_Distance_and_Shivered_Trust.md", "title": "ตอนที่ 5: ระยะห่างและเศษเสี้ยวความระแวง (The Tense Distance and Shivered Trust)" },
      { "file": "Chapter_06_The_Silent_Pages_and_the_Starry_Letters.md", "title": "ตอนที่ 6: ตัวอักษรดวงดาว กับภาษาที่เชื่อมใจ (The Silent Pages and the Starry Letters)" },
      { "file": "Chapter_07_The_Bound_Hearts_and_Five_Years_Dawn.md", "title": "ตอนที่ 7: คำสัญญาใต้ชายคา และห้าปีแห่งการเติบโต (The Bound Hearts and Five Years' Dawn)" }
    ];

    // Configure Marked with Custom Link & Image Renderer
    if (window.marked) {
      const renderer = new marked.Renderer();

      // Intercept Markdown Links (Compatible with Marked v10+ & Legacy)
      renderer.link = function (hrefOrToken, titleArg, textArg) {
        let href = '';
        let title = '';
        let text = '';

        if (hrefOrToken && typeof hrefOrToken === 'object') {
          // Marked v10+ Token signature
          href = hrefOrToken.href || '';
          title = hrefOrToken.title || '';
          text = hrefOrToken.text || (hrefOrToken.tokens && window.marked ? window.marked.parseInline(hrefOrToken.tokens) : '');
        } else {
          // Legacy 3-argument signature
          href = hrefOrToken || '';
          title = titleArg || '';
          text = textArg || '';
        }

        let cleanUrl = decodeURIComponent(href);

        // 1. Check if link points to an image file
        if (/\.(png|jpg|jpeg|gif|webp|svg)($|\?)/i.test(cleanUrl)) {
          const resolvedImgSrc = resolveImagePath(cleanUrl);
          return `<a href="${resolvedImgSrc}" class="image-link-badge" data-preview-img="${resolvedImgSrc}" title="${title || text || 'ดูรูปภาพ'}">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>${text}</span>
          </a>`;
        }

        // 2. Check if link points to an internal chapter/document
        const targetIdx = findChapterIndexByUrl(cleanUrl);
        if (targetIdx !== -1) {
          return `<a href="#" class="internal-doc-link" data-chapter-index="${targetIdx}" title="${title || text}">
            <span>${text}</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          </a>`;
        }

        // 3. External or default link
        return `<a href="${href}" target="_blank" rel="noopener noreferrer" title="${title || ''}">${text}</a>`;
      };

      // Intercept Markdown Image Embeds (Compatible with Marked v10+ & Legacy)
      renderer.image = function (hrefOrToken, titleArg, textArg) {
        let href = '';
        let title = '';
        let text = '';

        if (hrefOrToken && typeof hrefOrToken === 'object') {
          // Marked v10+ Token signature
          href = hrefOrToken.href || '';
          title = hrefOrToken.title || '';
          text = hrefOrToken.text || '';
        } else {
          // Legacy 3-argument signature
          href = hrefOrToken || '';
          title = titleArg || '';
          text = textArg || '';
        }

        let cleanUrl = decodeURIComponent(href);
        const resolvedSrc = resolveImagePath(cleanUrl);
        return `<figure class="reader-image-figure">
          <img src="${resolvedSrc}" alt="${text || title || 'รูปภาพประกอบ'}" title="${title || text || 'คลิกเพื่อขยายดูรูปภาพ'}" data-preview-img="${resolvedSrc}" loading="lazy" />
          ${text ? `<figcaption class="reader-image-caption">${text} (คลิกที่ภาพเพื่อขยาย)</figcaption>` : ''}
        </figure>`;
      };

      // Standalone Built-in Native Relationship Graph Renderer
      function parseGraphData(text) {
        const subgraphs = [];
        const nodesMap = {};
        const edges = [];

        let currentSubgraph = null;
        const lines = text.split('\n');

        for (let rawLine of lines) {
          let line = rawLine.trim();
          if (!line || line.startsWith('%%')) continue;

          // Subgraph start: subgraph ID["Title"]
          const subMatch = line.match(/^subgraph\s+([A-Za-z0-9_]+)(?:\["([^"]+)"\])?/i);
          if (subMatch) {
            currentSubgraph = {
              id: subMatch[1],
              title: subMatch[2] || subMatch[1],
              nodes: []
            };
            subgraphs.push(currentSubgraph);
            continue;
          }

          // Subgraph end
          if (line.toLowerCase() === 'end') {
            currentSubgraph = null;
            continue;
          }

          // Node definition: ID["Label<br>(Subtext)"] or ID["Label"]
          const nodeMatch = line.match(/^([A-Za-z0-9_]+)\["([^"]+)"\]/);
          if (nodeMatch) {
            const id = nodeMatch[1];
            const rawLabel = nodeMatch[2];
            const parts = rawLabel.split(/<br\s*\/?>/i);
            const label = parts[0].trim();
            const subtext = parts.slice(1).join(' ').trim();

            const nodeObj = { id, label, subtext, subgraphId: currentSubgraph ? currentSubgraph.id : null };
            nodesMap[id] = nodeObj;
            if (currentSubgraph) {
              currentSubgraph.nodes.push(nodeObj);
            }
            continue;
          }

          // Connections / Edges: A ==>|label| B or A -->|label| B or A <==>|label| B or A -.->|label| B
          const edgeMatch = line.match(/^([A-Za-z0-9_]+)\s*(<==>|==>|<-->|-->|-\.->)\s*(?:\|([^|]+)\|)?\s*([A-Za-z0-9_]+)/);
          if (edgeMatch) {
            const from = edgeMatch[1];
            const op = edgeMatch[2];
            const label = edgeMatch[3] || '';
            const to = edgeMatch[4];

            let type = 'solid';
            if (op === '==>' || op === '<==>') type = 'thick';
            if (op === '-.->') type = 'dashed';
            let isBidi = (op === '<==>' || op === '<-->');

            edges.push({ from, to, label, type, isBidi });
          }
        }

        // Collect orphan nodes not in any subgraph
        const orphanNodes = Object.values(nodesMap).filter(n => !n.subgraphId);
        if (orphanNodes.length > 0) {
          subgraphs.push({
            id: 'GENERAL',
            title: 'ตัวละครทั่วไป / อื่นๆ',
            nodes: orphanNodes
          });
        }

        return { subgraphs, nodesMap, edges };
      }

      function buildBuiltinGraphHtml(codeText) {
        const data = parseGraphData(codeText);
        if (Object.keys(data.nodesMap).length === 0 && data.subgraphs.length === 0) {
          return `<pre><code>${codeText}</code></pre>`;
        }

        // Build connection tree map: nodeId -> array of { targetLabel, label, type, arrow }
        const treeConnectionsMap = {};
        Object.keys(data.nodesMap).forEach(id => {
          treeConnectionsMap[id] = [];
        });

        data.edges.forEach(edge => {
          const fromNode = data.nodesMap[edge.from] || { label: edge.from };
          const toNode = data.nodesMap[edge.to] || { label: edge.to };

          let arrow = edge.isBidi ? '⇹' : '➔';
          if (edge.type === 'dashed') arrow = '⇢';

          // Add connection to 'from' character node
          if (treeConnectionsMap[edge.from]) {
            treeConnectionsMap[edge.from].push({
              targetLabel: toNode.label,
              label: edge.label,
              type: edge.type,
              arrow: arrow
            });
          }

          // If bidirectional, also add to 'to' character node
          if (edge.isBidi && treeConnectionsMap[edge.to]) {
            treeConnectionsMap[edge.to].push({
              targetLabel: fromNode.label,
              label: edge.label,
              type: edge.type,
              arrow: '⇹'
            });
          }
        });

        let html = `<div class="tree-graph-wrapper">`;
        html += `
        <div class="tree-graph-header">
          <span>แผนผังต้นไม้ความสัมพันธ์ (Character Relationship Tree)</span>
        </div>
      `;

        // Render Subgraphs & Nodes Tree
        html += `<div class="tree-nodes-list">`;
        data.subgraphs.forEach(sub => {
          if (!sub.nodes || sub.nodes.length === 0) return;

          html += `<div class="tree-subgraph-group">`;
          html += `<div class="tree-subgraph-title">${sub.title}</div>`;
          html += `<div class="tree-cards-list">`;

          sub.nodes.forEach(node => {
            const connections = treeConnectionsMap[node.id] || [];

            html += `
            <div class="tree-character-card" id="tree-node-${node.id}">
              <div class="tree-char-header">
                <span class="tree-char-title">${node.label}</span>
                ${node.subtext ? `<span class="tree-char-subtext">(${node.subtext})</span>` : ''}
              </div>
          `;

            if (connections.length > 0) {
              html += `<div class="tree-branches">`;
              connections.forEach((conn, index) => {
                const isLast = index === connections.length - 1;
                const symbol = isLast ? '└─' : '├─';

                html += `
                <div class="tree-branch">
                  <span class="tree-branch-symbol">${symbol}</span>
                  <span class="tree-branch-target">${conn.targetLabel}</span>
                  <span class="tree-branch-arrow">${conn.arrow}</span>
                  ${conn.label ? `<span class="tree-branch-badge ${conn.type}">${conn.label}</span>` : ''}
                </div>
              `;
              });
              html += `</div>`;
            } else {
              html += `<div style="font-size:0.78rem; color:var(--text-muted); padding-left:16px;">ไม่มีสายสัมพันธ์เพิ่มเติม</div>`;
            }

            html += `</div>`; // .tree-character-card
          });

          html += `</div></div>`; // .tree-cards-list & .tree-subgraph-group
        });

        html += `</div></div>`; // .tree-nodes-list & .tree-graph-wrapper
        return html;
      }

      // Intercept Code Blocks for Graph Diagrams
      renderer.code = function (code, lang) {
        let textCode = typeof code === 'object' ? code.text : code;
        let language = typeof code === 'object' ? (code.lang || '') : (lang || '');
        let trimmed = (textCode || '').trim();

        if (language === 'mermaid' || trimmed.startsWith('graph ') || trimmed.startsWith('sequenceDiagram') || trimmed.startsWith('flowchart') || trimmed.startsWith('gantt') || trimmed.startsWith('classDiagram')) {
          let cleanCode = removeAllEmojis(textCode);
          return buildBuiltinGraphHtml(cleanCode);
        }
        return `<pre><code class="language-${language}">${textCode}</code></pre>`;
      };

      // Responsive Table Renderer & Threat Badges Formatting (Compatible with Marked v10+ & Legacy)
      renderer.table = function (headerOrToken, bodyArg) {
        let headerHtml = '';
        let bodyHtml = '';

        if (headerOrToken && typeof headerOrToken === 'object') {
          // Marked v10+ Token signature
          const token = headerOrToken;
          
          if (token.header && Array.isArray(token.header)) {
            headerHtml = '<tr>' + token.header.map(cell => {
              const cellText = window.marked ? window.marked.parseInline(cell.text || '') : cell.text;
              const align = cell.align ? ` style="text-align:${cell.align}"` : '';
              return `<th${align}>${cellText}</th>`;
            }).join('') + '</tr>';
          }

          if (token.rows && Array.isArray(token.rows)) {
            bodyHtml = token.rows.map(row => {
              const cellsHtml = row.map(cell => {
                let cellText = window.marked ? window.marked.parseInline(cell.text || '') : cell.text;
                cellText = cellText.replace(/\[THREAT-([A-Z0-9]+)\]/gi, (match, p1) => {
                  const classKey = 'threat-' + p1.toLowerCase();
                  return `<span class="threat-tag-badge ${classKey}">[THREAT-${p1.toUpperCase()}]</span>`;
                });
                const align = cell.align ? ` style="text-align:${cell.align}"` : '';
                return `<td${align}>${cellText}</td>`;
              }).join('');
              return `<tr>${cellsHtml}</tr>`;
            }).join('');
          }
        } else {
          // Legacy 2-argument signature
          headerHtml = headerOrToken || '';
          bodyHtml = bodyArg || '';
          
          bodyHtml = bodyHtml.replace(/\[THREAT-([A-Z0-9]+)\]/gi, (match, p1) => {
            const classKey = 'threat-' + p1.toLowerCase();
            return `<span class="threat-tag-badge ${classKey}">[THREAT-${p1.toUpperCase()}]</span>`;
          });
        }

        return `<div class="table-container">
          <table>
            <thead>${headerHtml}</thead>
            <tbody>${bodyHtml}</tbody>
          </table>
        </div>`;
      };

      marked.use({
        renderer: renderer,
        breaks: true,
        gfm: true
      });
    }

    // Comprehensive emoji removal helper
    function removeAllEmojis(str) {
      if (!str) return '';
      return str.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]|\uD83D[\uDE00-\uDE4F]|\uD83C[\uDF00-\uDFFF]|\uD83D[\uDE80-\uDEF6]|\uFE0F)/g, '');
    }

    // Preprocess markdown to remove emojis and fix headers/dividers dynamically
    function preprocessMarkdown(text) {
      if (!text) return '';

      let cleanText = removeAllEmojis(text);

      const lines = cleanText.split('\n');
      let firstNonEmpty = true;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        if (firstNonEmpty) {
          if (!line.startsWith('#')) {
            lines[i] = '# ' + line;
          }
          firstNonEmpty = false;
          continue;
        }

        // Convert custom headings to standard markdown
        if (line.startsWith('✦')) {
          lines[i] = '## ' + line.substring(1).trim();
        } else if (line.startsWith('🌿')) {
          lines[i] = '### ' + line.substring(1).trim();
        } else if (/^(วัย|อายุ)\s*\d+/.test(line) && line.length < 120 && !line.startsWith('#')) {
          lines[i] = '### ' + line;
        } else if (line === '---') {
          lines[i] = '\n---\n';
        }
      }

      return lines.join('\n');
    }

    // Advanced Thai word segmenter using Intl.Segmenter
    function applyThaiWordBreaks(element) {
      if (!window.Intl || !window.Intl.Segmenter) {
        console.warn('Intl.Segmenter is not supported. Falling back to native browser word breaks.');
        return;
      }
      try {
        const segmenter = new Intl.Segmenter('th', { granularity: 'word' });

        function walk(node) {
          if (node.nodeType === Node.TEXT_NODE) {
            const text = node.nodeValue;
            if (/[\u0e00-\u0e7f]/.test(text)) {
              const segments = segmenter.segment(text);
              let result = '';
              for (const segment of segments) {
                result += segment.segment;
                if (segment.isWordLike) {
                  result += '\u200B'; // Insert Zero-Width Space
                }
              }
              node.nodeValue = result;
            }
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            // Skip non-reading elements
            if (node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE' && node.tagName !== 'TEXTAREA') {
              for (let child = node.firstChild; child; child = child.nextSibling) {
                walk(child);
              }
            }
          }
        }

        walk(element);
      } catch (e) {
        console.error('Error segmenting Thai words:', e);
      }
    }

    function updateCommentBadge() {
      const currentFile = STATE.chapters[STATE.currentChapterIndex]?.file;
      const chapterCount = commentsDb.filter(c => c.chapterFile === currentFile).length;
      const totalCount = commentsDb.length;
