    function renderCommentsForCurrentChapter() {
      const currentFile = STATE.chapters[STATE.currentChapterIndex]?.file;
      if (!currentFile) return;

      const chapterComments = commentsDb.filter(c => c.chapterFile === currentFile);
      const blocks = elements.readerContent.children;

      const commentsByBlock = {};
      chapterComments.forEach(comment => {
        if (!commentsByBlock[comment.blockIndex]) {
          commentsByBlock[comment.blockIndex] = [];
        }
        commentsByBlock[comment.blockIndex].push(comment);
      });

      for (const blockIdx in commentsByBlock) {
        const blockEl = blocks[blockIdx];
        if (!blockEl) continue;

        // Sort comments inside this block by startOffset descending to prevent index shift issues when wrapping!
        const blockComments = commentsByBlock[blockIdx].sort((a, b) => b.startOffset - a.startOffset);

        blockComments.forEach(comment => {
          // Double check selection matches text content to prevent corruption
          const textAtRange = blockEl.textContent.substring(comment.startOffset, comment.endOffset);
          if (textAtRange === comment.selectedText) {
            wrapTextRange(blockEl, comment.startOffset, comment.endOffset, `comment-highlight status-${comment.type}`, comment.id);
          } else {
            // Fallback: If offset shifted because of content edit, try to find the selectedText exactly (only if it is unique in paragraph)
            const firstIdx = blockEl.textContent.indexOf(comment.selectedText);
            const lastIdx = blockEl.textContent.lastIndexOf(comment.selectedText);
            if (firstIdx !== -1 && firstIdx === lastIdx) {
              wrapTextRange(blockEl, firstIdx, firstIdx + comment.selectedText.length, `comment-highlight status-${comment.type}`, comment.id);
            }
          }
        });
      }
    }

    function wrapTextRange(element, start, end, className, commentId) {
      const textNodes = [];
      const walk = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
      let node;
      while (node = walk.nextNode()) {
        textNodes.push(node);
      }

      let currentPos = 0;
      let startNode = null, startOffset = 0;
      let endNode = null, endOffset = 0;

      for (const textNode of textNodes) {
        const len = textNode.nodeValue.length;
        if (currentPos <= start && start < currentPos + len) {
          startNode = textNode;
          startOffset = start - currentPos;
        }
        if (currentPos <= end && end <= currentPos + len) {
          endNode = textNode;
          endOffset = end - currentPos;
          break;
        }
        currentPos += len;
      }

      if (!startNode || !endNode) return;

      const range = document.createRange();
      range.setStart(startNode, startOffset);
      range.setEnd(endNode, endOffset);

      const span = document.createElement('span');
      span.className = className;
      span.setAttribute('data-comment-id', commentId);

      try {
        range.surroundContents(span);
      } catch (e) {
        try {
          const content = range.extractContents();
          span.appendChild(content);
          range.insertNode(span);
        } catch (err) {
          console.error('Error wrapping content:', err);
        }
      }
    }

    let currentSelectionData = null;

    function checkSelection(e) {
      // Ignore if clicking inside the selection menu
      if (e && e.target && e.target.closest('#selection-menu')) {
        return;
      }
      // Delay slightly to let the selection settle
      setTimeout(() => {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed) {
          hideSelectionMenu();
          return;
        }

        const selectedText = selection.toString().trim();
        if (selectedText === '') {
          hideSelectionMenu();
          return;
        }

        // Verify the selection is inside .reader-content
        let node = selection.anchorNode;
        let isInsideReader = false;
        while (node) {
          if (node === elements.readerContent) {
            isInsideReader = true;
            break;
          }
          node = node.parentNode;
        }

        if (!isInsideReader) {
          hideSelectionMenu();
          return;
        }

        // Find the block element (direct child of readerContent)
        let blockEl = selection.anchorNode;
        if (blockEl.nodeType === Node.TEXT_NODE) {
          blockEl = blockEl.parentNode;
        }
        while (blockEl && blockEl.parentNode !== elements.readerContent) {
          blockEl = blockEl.parentNode;
        }

        if (!blockEl) {
          hideSelectionMenu();
          return;
        }

        const blockIndex = Array.from(elements.readerContent.children).indexOf(blockEl);
        if (blockIndex === -1) {
          hideSelectionMenu();
          return;
        }

        // Get character offsets
        const offsets = getSelectionCharacterOffsetsWithin(blockEl);

        currentSelectionData = {
          chapterFile: STATE.chapters[STATE.currentChapterIndex].file,
          blockIndex: blockIndex,
          selectedText: selection.toString(),
          startOffset: offsets.start,
          endOffset: offsets.end
        };

        // Position selection menu
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        showSelectionMenu(rect);
      }, 50);
    }

    function getSelectionCharacterOffsetsWithin(element) {
      let start = 0, end = 0;
      const sel = window.getSelection();
      if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const preCaretRange = range.cloneRange();
        preCaretRange.selectNodeContents(element);
        preCaretRange.setEnd(range.startContainer, range.startOffset);
        start = preCaretRange.toString().length;
        end = start + range.toString().length;
      }
      return { start, end };
    }

    function showSelectionMenu(rect) {
      const menu = document.getElementById('selection-menu');
      if (!menu) return;

      const menuWidth = 90;
      const menuHeight = 40;

      let top = rect.top + window.scrollY - menuHeight - 8;
      let left = rect.left + window.scrollX + (rect.width / 2) - (menuWidth / 2);

      // Keep inside screen boundaries
      if (top < window.scrollY + 60) {
        top = rect.bottom + window.scrollY + 8;
      }
      if (left < 10) left = 10;
      if (left + menuWidth > window.innerWidth - 10) {
        left = window.innerWidth - menuWidth - 10;
      }

      menu.style.top = `${top}px`;
      menu.style.left = `${left}px`;
      menu.classList.add('active');
    }

    function hideSelectionMenu() {
      const menu = document.getElementById('selection-menu');
      if (menu) {
        menu.classList.remove('active');
      }
    }

    // Modal and Sidebar Elements
    const modal = document.getElementById('comment-modal');
    const modalTitle = document.getElementById('comment-modal-title');
    const modalQuote = document.getElementById('comment-modal-quote');
    const modalTextarea = document.getElementById('comment-modal-textarea');
    const modalCancel = document.getElementById('comment-modal-cancel');
    const modalSave = document.getElementById('comment-modal-save');
    let currentCommentType = 'praise';

    const commentSidebar = document.getElementById('comment-sidebar');
    const commentSidebarBtn = document.getElementById('comment-sidebar-btn');
    const closeCommentSidebarBtn = document.getElementById('close-comment-sidebar-btn');
    const commentSidebarList = document.getElementById('comment-sidebar-list');
    const commentExportBtn = document.getElementById('comment-export-btn');
    const tooltip = document.getElementById('comment-tooltip');

    function openCommentModal(type) {
      if (!currentSelectionData) return;
      currentCommentType = type;
      hideSelectionMenu();

      // Clear range selection
      window.getSelection().removeAllRanges();

      modalTitle.textContent = type === 'praise' ? 'ชื่นชมเนื้อหา (Praise)' : 'เสนอแนะให้แก้ไข (Suggestion)';
      modalTitle.className = `modal-title ${type}`;
      modalQuote.textContent = `"${currentSelectionData.selectedText}"`;
      modalTextarea.value = '';

      modal.classList.add('open');
      modalTextarea.focus();
    }

    function closeCommentModal() {
      modal.classList.remove('open');
      currentSelectionData = null;
    }

    function toggleCommentSidebar(open) {
      if (open) {
        commentSidebar.classList.add('open');
        renderCommentSidebarList();
        toggleSidebar(false); // Close left chapter sidebar
      } else {
        commentSidebar.classList.remove('open');
      }
    }

    function isSameDate(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getDate() === d2.getDate();
    }

    function filterCommentsByDate(comments) {
      const presetSelect = document.getElementById('comment-date-preset');
      const preset = presetSelect ? presetSelect.value : (STATE.datePreset || 'today');
      const now = new Date();

      if (preset === 'today') {
        return comments.filter(c => {
          const cDate = new Date(c.timestamp);
          return isSameDate(cDate, now);
        });
      }

      if (preset === '7days') {
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(now.getDate() - 7);
        sevenDaysAgo.setHours(0, 0, 0, 0);
        return comments.filter(c => new Date(c.timestamp) >= sevenDaysAgo);
      }

      if (preset === 'custom') {
        const startEl = document.getElementById('comment-date-start');
        const endEl = document.getElementById('comment-date-end');

        let startDate = startEl && startEl.value ? new Date(startEl.value) : null;
        let endDate = endEl && endEl.value ? new Date(endEl.value) : null;

        if (startDate) startDate.setHours(0, 0, 0, 0);
        if (endDate) endDate.setHours(23, 59, 59, 999);

        return comments.filter(c => {
          const cDate = new Date(c.timestamp);
          if (startDate && cDate < startDate) return false;
          if (endDate && cDate > endDate) return false;
          return true;
        });
      }

      // preset === 'all'
      return comments;
    }

    function renderCommentSidebarList() {
      commentSidebarList.innerHTML = '';
      const currentFile = STATE.chapters[STATE.currentChapterIndex]?.file;
      const filter = STATE.commentFilter || 'chapter';

      let targetComments = [];
      if (filter === 'chapter') {
        targetComments = commentsDb.filter(c => c.chapterFile === currentFile);
      } else if (filter === 'all') {
        targetComments = [...commentsDb];
      } else if (filter === 'praise') {
        targetComments = commentsDb.filter(c => c.type === 'praise');
      } else if (filter === 'suggest') {
        targetComments = commentsDb.filter(c => c.type === 'suggest');
      }

      // Filter by Date
      const finalComments = filterCommentsByDate(targetComments);

      // Update Tag Count
      const tag = document.getElementById('filtered-comments-tag');
      if (tag) {
        tag.textContent = `${finalComments.length} รายการ`;
      }

      if (finalComments.length === 0) {
        let msg = 'ไม่มีความคิดเห็นตามเงื่อนไขที่เลือก';
        const preset = document.getElementById('comment-date-preset')?.value || 'today';
        if (preset === 'today') msg = 'ไม่มีความคิดเห็นในวันนี้';

        commentSidebarList.innerHTML = `<div class="empty-comments">${msg}<br><small style="opacity: 0.6; display: block; margin-top: 4px;">ลองเปลี่ยนตัวกรองวันที่หรือไฮไลท์ข้อความใหม่</small></div>`;
        return;
      }

      // Sort by date descending
      finalComments.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      finalComments.forEach(comment => {
        const card = document.createElement('div');
        card.className = 'comment-card';
        card.title = 'คลิกเพื่อวาร์ปไปยังจุดที่บันทึกความคิดเห็น';

        // Whole card click handler: Warp / Swap to comment location!
        card.addEventListener('click', (e) => {
          // Do not jump if user clicked copy or delete buttons
          if (e.target.closest('.comment-card-btn')) return;
          jumpToComment(comment.chapterFile, comment.id);
        });

        // Chapter Badge (when viewing 'all' or filtered lists)
        const chapterObj = STATE.chapters.find(ch => ch.file === comment.chapterFile);
        const chapterTitle = chapterObj ? chapterObj.title.split('(')[0].trim() : comment.chapterFile;

        const chapterBadge = document.createElement('div');
        chapterBadge.className = 'comment-card-chapter-badge';
        chapterBadge.innerHTML = `<span>[บท]</span> <span>${chapterTitle}</span>`;
        chapterBadge.title = 'คลิกเพื่อข้ามไปอ่านบทนี้';

        const quote = document.createElement('blockquote');
        quote.className = 'comment-card-quote';
        quote.textContent = `"${comment.selectedText}"`;
        quote.title = 'คลิกเพื่อเลื่อนไปยังข้อความที่ไฮไลท์';

        const header = document.createElement('div');
        header.className = 'comment-card-header';

        const badge = document.createElement('span');
        badge.className = `comment-card-badge ${comment.type}`;
        badge.textContent = comment.type === 'praise' ? 'ชื่นชม' : 'เสนอแนะ';

        header.appendChild(badge);

        const text = document.createElement('div');
        text.className = 'comment-card-text';
        text.textContent = comment.text;

        const footer = document.createElement('div');
        footer.className = 'comment-card-footer';

        const time = document.createElement('span');
        time.className = 'comment-card-time';
        time.textContent = new Date(comment.timestamp).toLocaleDateString('th-TH', {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        const btns = document.createElement('div');
        btns.className = 'comment-card-btns';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'comment-card-btn';
        copyBtn.title = 'คัดลอกข้อความฟีดแบ็ก';
        copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          copyCommentText(comment);
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'comment-card-btn delete';
        delBtn.title = 'ลบความคิดเห็น';
        delBtn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('คุณต้องการลบความคิดเห็นนี้ใช่หรือไม่?')) {
            deleteComment(comment.id);
          }
        });

        btns.appendChild(copyBtn);
        btns.appendChild(delBtn);

        footer.appendChild(time);
        footer.appendChild(btns);

        card.appendChild(chapterBadge);
        card.appendChild(quote);
        card.appendChild(header);
        card.appendChild(text);
        card.appendChild(footer);

        commentSidebarList.appendChild(card);
      });
    }

    function jumpToComment(chapterFile, commentId) {
      // Auto-close comment sidebar on mobile screens (screen width <= 768px)
      // so reader text is immediately visible!
      if (window.innerWidth <= 768) {
        toggleCommentSidebar(false);
      }

      const targetIdx = STATE.chapters.findIndex(c => c.file === chapterFile);
      if (targetIdx !== -1) {
        if (STATE.currentChapterIndex !== targetIdx) {
          selectChapter(targetIdx);
          setTimeout(() => {
            scrollToCommentHighlight(commentId);
          }, 450);
        } else {
          scrollToCommentHighlight(commentId);
        }
      }
    }

    function deleteComment(commentId) {
      commentsDb = commentsDb.filter(c => c.id !== commentId);
      saveCommentsToStorage();
      renderCommentSidebarList();
      
      const span = document.querySelector(`.comment-highlight[data-comment-id="${commentId}"]`);
      if (span) {
        const parent = span.parentNode;
        while (span.firstChild) {
          parent.insertBefore(span.firstChild, span);
        }
        parent.removeChild(span);
        parent.normalize();
      }
    }

    function scrollToCommentHighlight(commentId) {
      const targetComment = commentsDb.find(c => c.id === commentId);
      let span = document.querySelector(`.comment-highlight[data-comment-id="${commentId}"]`);

      // Fallback: If highlight span wasn't created yet or chapter re-rendered, trigger comment rendering
      if (!span && targetComment) {
        renderCommentsForCurrentChapter();
        span = document.querySelector(`.comment-highlight[data-comment-id="${commentId}"]`);
      }

      if (span) {
        // Scroll smooth center
        span.scrollIntoView({ behavior: 'smooth', block: 'center' });

        // Trigger high-visibility flash pulse animation
        span.classList.remove('jump-active');
        void span.offsetWidth; // force reflow
        span.classList.add('jump-active');

        // Show floating tooltip popup automatically above the highlighted sentence
        if (targetComment) {
          showTooltip(span, targetComment);
          setTimeout(() => {
            hideTooltip();
          }, 4000);
        }
      } else if (targetComment) {
        // Ultimate Fallback: scroll to paragraph block directly if exact offset shifted
        const blocks = elements.readerContent.children;
        const blockEl = blocks[targetComment.blockIndex];
        if (blockEl) {
          blockEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          blockEl.style.transition = 'background-color 0.5s ease';
          const originalBg = blockEl.style.backgroundColor;
          blockEl.style.backgroundColor = 'rgba(245, 158, 11, 0.3)';
          setTimeout(() => {
            blockEl.style.backgroundColor = originalBg;
          }, 2500);
        }
      }
    }

    function copyCommentText(comment) {
      const typeStr = comment.type === 'praise' ? 'ชื่นชม' : 'เสนอแนะให้แก้ไข';
      const textToCopy = `**[${typeStr}]** ในบท: ${STATE.chapters[STATE.currentChapterIndex].title}\n> ข้อความ: "${comment.selectedText}"\n\nความเห็น: ${comment.text}`;
      navigator.clipboard.writeText(textToCopy).then(() => {
        alert('คัดลอกข้อความเรียบร้อยแล้ว!');
      }).catch(err => {
        console.error('Failed to copy text', err);
      });
    }

    function showTooltip(targetEl, comment) {
      if (!tooltip) return;

      const typeStr = comment.type === 'praise' ? 'ชื่นชม' : 'เสนอแนะ';
      const typeClass = comment.type;

      tooltip.innerHTML = `
        <div class="tooltip-header ${typeClass}">
          <span>${typeStr}</span>
          <span class="tooltip-time">${new Date(comment.timestamp).toLocaleDateString('th-TH')}</span>
        </div>
        <div style="font-weight: 500; margin-top: 4px; color: var(--text-color);">${comment.text}</div>
      `;

      tooltip.classList.add('active');

      const rect = targetEl.getBoundingClientRect();
      const tooltipHeight = tooltip.offsetHeight;
      const tooltipWidth = tooltip.offsetWidth;

      let top = rect.top + window.scrollY - tooltipHeight - 8;
      let left = rect.left + window.scrollX + (rect.width / 2) - (tooltipWidth / 2);

      if (top < window.scrollY + 60) {
        top = rect.bottom + window.scrollY + 8;
      }
      if (left < 10) left = 10;
      if (left + tooltipWidth > window.innerWidth - 10) {
        left = window.innerWidth - tooltipWidth - 10;
      }

      tooltip.style.top = `${top}px`;
      tooltip.style.left = `${left}px`;
    }

    function hideTooltip() {
      if (tooltip) {
        tooltip.classList.remove('active');
      }
    }

    function setupCommentEventListeners() {
      // Mouse/Touch triggers for selection
      document.addEventListener('pointerup', checkSelection);

      // Floating menu actions
      document.getElementById('sel-btn-praise').addEventListener('click', (e) => {
        e.stopPropagation();
        openCommentModal('praise');
      });

      document.getElementById('sel-btn-suggest').addEventListener('click', (e) => {
        e.stopPropagation();
        openCommentModal('suggest');
      });

      // Modal buttons
      modalCancel.addEventListener('click', closeCommentModal);
      modalSave.addEventListener('click', () => {
        const text = modalTextarea.value.trim();
        if (!text) {
          alert('กรุณากรอกความคิดเห็น');
          return;
        }

        const newComment = {
          id: 'c_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
          chapterFile: currentSelectionData.chapterFile,
          blockIndex: currentSelectionData.blockIndex,
          selectedText: currentSelectionData.selectedText,
          startOffset: currentSelectionData.startOffset,
          endOffset: currentSelectionData.endOffset,
          type: currentCommentType,
          text: text,
          timestamp: new Date().toISOString()
        };

        commentsDb.push(newComment);
        saveCommentsToStorage();
        closeCommentModal();
        
        const blockEl = elements.readerContent.children[newComment.blockIndex];
        if (blockEl) {
          wrapTextRange(blockEl, newComment.startOffset, newComment.endOffset, `comment-highlight status-${newComment.type}`, newComment.id);
        }
        
        toggleCommentSidebar(true);
      });

      // Comment Filter Tabs Event Listeners
      const tabBtns = document.querySelectorAll('.comment-tab-btn');
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          tabBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          STATE.commentFilter = btn.dataset.filter;
          renderCommentSidebarList();
        });
      });

      // Date Filter Preset & Custom Dates Event Listeners
      const datePresetSelect = document.getElementById('comment-date-preset');
      const customDateGroup = document.getElementById('comment-custom-date-group');
      const dateStartInput = document.getElementById('comment-date-start');
      const dateEndInput = document.getElementById('comment-date-end');

      if (datePresetSelect) {
        datePresetSelect.addEventListener('change', (e) => {
          STATE.datePreset = e.target.value;
          if (e.target.value === 'custom') {
            if (customDateGroup) customDateGroup.style.display = 'flex';
          } else {
            if (customDateGroup) customDateGroup.style.display = 'none';
          }
          renderCommentSidebarList();
        });
      }

      if (dateStartInput) {
        dateStartInput.addEventListener('change', () => renderCommentSidebarList());
      }
      if (dateEndInput) {
        dateEndInput.addEventListener('change', () => renderCommentSidebarList());
      }

      // Sidebar buttons
      commentSidebarBtn.addEventListener('click', () => {
        const isOpen = commentSidebar.classList.contains('open');
        toggleCommentSidebar(!isOpen);
      });

      closeCommentSidebarBtn.addEventListener('click', () => {
        toggleCommentSidebar(false);
      });

      commentExportBtn.addEventListener('click', () => {
        const currentFile = STATE.chapters[STATE.currentChapterIndex]?.file;
        const filter = STATE.commentFilter || 'chapter';

        let targetComments = [];
        if (filter === 'chapter') {
          targetComments = commentsDb.filter(c => c.chapterFile === currentFile);
        } else if (filter === 'all') {
          targetComments = [...commentsDb];
        } else if (filter === 'praise') {
          targetComments = commentsDb.filter(c => c.type === 'praise');
        } else if (filter === 'suggest') {
          targetComments = commentsDb.filter(c => c.type === 'suggest');
        }

        const commentsToExport = filterCommentsByDate(targetComments);

        if (commentsToExport.length === 0) {
          alert('ไม่พบความคิดเห็นในเงื่อนไขการกรอง/ช่วงวันที่ที่เลือก');
          return;
        }

        const preset = STATE.datePreset || 'filtered';
        const dateStr = new Date().toISOString().split('T')[0];
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(commentsToExport, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `novel_comments_${preset}_${dateStr}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      });

      // Tooltips and Click Handlers for Reader Content (Doc Links, Image Preview, Highlights)
      elements.readerContent.addEventListener('mouseover', (e) => {
        const highlight = e.target.closest('.comment-highlight');
        if (highlight) {
          const commentId = highlight.getAttribute('data-comment-id');
          const comment = commentsDb.find(c => c.id === commentId);
          if (comment) {
            showTooltip(highlight, comment);
          }
        }
      });

      elements.readerContent.addEventListener('mouseout', (e) => {
        if (e.target.closest('.comment-highlight')) {
          hideTooltip();
        }
      });

      elements.readerContent.addEventListener('click', (e) => {
        // 1. Internal Markdown Document Navigation Link
        const docLink = e.target.closest('.internal-doc-link');
        if (docLink) {
          e.preventDefault();
          e.stopPropagation();
          const targetIdx = parseInt(docLink.getAttribute('data-chapter-index'), 10);
          if (!isNaN(targetIdx) && STATE.chapters[targetIdx]) {
            selectChapter(targetIdx);
          }
          return;
        }

        // 2. Image Click (or Image Link Badge Click) -> Lightbox Modal
        const imgLink = e.target.closest('[data-preview-img]');
        if (imgLink) {
          e.preventDefault();
          e.stopPropagation();
          const imgSrc = imgLink.getAttribute('data-preview-img');
          const caption = imgLink.getAttribute('alt') || imgLink.getAttribute('title') || '';
          openImageModal(imgSrc, caption);
          return;
        }

        // 3. Highlight Comment Tooltip
        const highlight = e.target.closest('.comment-highlight');
        if (highlight) {
          e.stopPropagation();
          const commentId = highlight.getAttribute('data-comment-id');
          const comment = commentsDb.find(c => c.id === commentId);
          if (comment) {
            showTooltip(highlight, comment);
            if ('ontouchstart' in window) {
              setTimeout(hideTooltip, 4000);
            }
          }
        } else {
          hideTooltip();
        }
      });

      document.addEventListener('click', () => {
        hideTooltip();
      });
    }

    // Image Preview Lightbox Modal Functions
    const imageModal = document.getElementById('image-modal');
    const imageModalImg = document.getElementById('image-modal-img');
    const imageModalCaption = document.getElementById('image-modal-caption');
    const closeImageModalBtn = document.getElementById('close-image-modal-btn');
    const imageZoomBtn = document.getElementById('image-zoom-btn');

    function openImageModal(src, caption) {
      if (!imageModal || !imageModalImg) return;
      imageModalImg.src = src;
      imageModalImg.classList.remove('zoomed');
      imageModalCaption.textContent = caption || '';
      imageModal.classList.add('open');
    }

    function closeImageModal() {
      if (imageModal) {
        imageModal.classList.remove('open');
        if (imageModalImg) imageModalImg.classList.remove('zoomed');
      }
    }

    if (closeImageModalBtn) {
      closeImageModalBtn.addEventListener('click', closeImageModal);
    }

    if (imageModal) {
      imageModal.addEventListener('click', (e) => {
        if (e.target === imageModal || e.target.classList.contains('image-modal-container')) {
          closeImageModal();
        }
      });
    }

    if (imageModalImg) {
      imageModalImg.addEventListener('click', (e) => {
        e.stopPropagation();
        imageModalImg.classList.toggle('zoomed');
      });
    }

    if (imageZoomBtn) {
      imageZoomBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (imageModalImg) imageModalImg.classList.toggle('zoomed');
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeImageModal();
      }
    });

    // Initial load
    (async function init() {
      initSettings();
      initComments();
      await loadChaptersList();
      selectChapter(STATE.currentChapterIndex);
    })();
  </script>
</body>
